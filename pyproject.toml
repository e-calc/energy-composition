[project]
name = "ecalc"
version = "0.1.0"
description = "Per-kernel GPU energy database study: E = dynamic + static_power * time"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "torchvision",
    "ultralytics>=8.4",
    "zeus>=0.16",
    "nvidia-ml-py",
    "pandas",
    "numpy",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecalc"]

[tool.pytest.ini_options]
markers = ["gpu: requires a CUDA GPU"]
testpaths = ["tests"]
