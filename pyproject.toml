[project]
name = "ecalc"
version = "0.1.0"
description = "Per-kernel GPU energy database study: E = dynamic + static_power * time"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "torchvision",
    "ultralytics>=8.4",
    "zeus>=0.16",
    "nvidia-ml-py",
    "pandas",
    "numpy",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
# zeus master at the merge of ml-energy/zeus#263 (`warmup_settle_duration` in zeus.profile.measure); not in 0.16.0.
zeus = { git = "https://github.com/ml-energy/zeus", rev = "796e8ada280ced0b31a11243cb8b2dae13f403d1" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecalc"]

[tool.pytest.ini_options]
markers = ["gpu: requires a CUDA GPU"]
testpaths = ["tests"]
