name: tests

on:
  push:
  pull_request:

jobs:
  calculus:
    name: calculus (standard library only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      # No torch here on purpose: the calculus, serialization, formula mode and the
      # command line must work without it.
      - run: python -m pytest tests -m "not gpu" -q

  capture:
    name: capture (torch on CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest tests -m "not gpu" -q
